# PORTA
server:
  port: 8081
  address: 0.0.0.0

# DATASOURCE
spring:
  datasource:
    url: jdbc:h2:mem:pedidosdb
    driver-class-name: org.h2.Driver
    username: admin
    password: ""
  # H2 DATABASE
  h2:
    console:
      enabled: true  # URL -> http://localhost:8081/h2-console
      settings:
        web-allow-others: true
  # JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  # KAFKA
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# SWAGGER / OpenAPI
springdoc:
  swagger-ui:
    operationsSorter: method  # URL -> http://localhost:8081/swagger-ui/index.html

# JWT CONFIGURATION
jwt:
  secret: ${JWT_SECRET:umaSecretMuitoMaisLongaQue32Caracteres123456}

# LOGS
logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN